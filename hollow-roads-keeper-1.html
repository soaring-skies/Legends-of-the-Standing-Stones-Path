<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keeper of the Hollow Roads</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1a12;
      color: #e8f0e0;
      font-family: 'Segoe UI', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #c9e4b0;
      text-shadow: 0 0 12px rgba(140, 200, 100, 0.4);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #8aab7a;
      margin-bottom: 16px;
      font-style: italic;
    }
    #ui {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 960px;
      width: 100%;
    }
    #left {
      flex: 1;
      min-width: 280px;
      max-width: 340px;
    }
    #right {
      flex: 1;
      min-width: 320px;
    }
    canvas {
      background: linear-gradient(180deg, #1a2e1f 0%, #0d1a12 100%);
      border: 2px solid #3a5a3a;
      border-radius: 8px;
      display: block;
      margin: 0 auto 12px;
      box-shadow: 0 0 24px rgba(60, 100, 50, 0.3);
    }
    .panel {
      background: rgba(20, 35, 25, 0.85);
      border: 1px solid #3a5a3a;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .panel h2 {
      font-size: 1rem;
      color: #a8d080;
      margin-bottom: 8px;
      border-bottom: 1px solid #2a4a2a;
      padding-bottom: 4px;
    }
    .res {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      font-size: 0.95rem;
    }
    .res span:last-child {
      color: #c9e4b0;
      font-weight: 600;
    }
    button {
      background: #2a4a2a;
      color: #e8f0e0;
      border: 1px solid #4a7a4a;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) {
      background: #3a6a3a;
      border-color: #6aaa6a;
      box-shadow: 0 0 8px rgba(100, 180, 80, 0.3);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #log {
      height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #b8d0a8;
    }
    #log p {
      margin-bottom: 6px;
      padding-left: 8px;
      border-left: 2px solid #3a5a3a;
    }
    #log p.event {
      border-left-color: #8ac060;
      color: #d0f0b0;
    }
    #log p.warn {
      border-left-color: #c0a040;
      color: #e8d080;
    }
    .legend-bar {
      height: 10px;
      background: #1a2a1a;
      border-radius: 5px;
      margin-top: 8px;
      overflow: hidden;
    }
    .legend-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a8a3a, #8ad060);
      width: 0%;
      transition: width 0.4s;
    }
    .status {
      font-size: 0.8rem;
      color: #7a9a6a;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>KEEPER OF THE HOLLOW ROADS</h1>
  <div class="subtitle">Legends of the Standing Stones</div>

  <div id="ui">
    <div id="left">
      <div class="panel">
        <h2>The Circle & Roads</h2>
        <canvas id="map" width="300" height="260"></canvas>
        <div class="status" id="mapStatus">The ancient circle waits.</div>
      </div>

      <div class="panel">
        <h2>Actions</h2>
        <button id="btnRepair">Repair a Stone (2 Essence)</button>
        <button id="btnClear">Clear a Road (2 Knowledge)</button>
        <button id="btnOffer">Leave Offering (1 Offering)</button>
        <button id="btnSeek">Seek a Legend (3 Knowledge)</button>
        <button id="btnEnd" style="background:#3a3a2a;border-color:#6a6a4a;margin-top:8px;">End the Day</button>
      </div>
    </div>

    <div id="right">
      <div class="panel">
        <h2>Resources</h2>
        <div class="res"><span>Essence</span><span id="resEssence">5</span></div>
        <div class="res"><span>Knowledge</span><span id="resKnowledge">3</span></div>
        <div class="res"><span>Offerings</span><span id="resOfferings">2</span></div>
        <div class="res"><span>Traveler Favor</span><span id="resFavor">0</span></div>
        <div class="res"><span>Legend Strength</span><span id="resLegend">0</span></div>
        <div class="legend-bar"><div class="legend-fill" id="legendFill"></div></div>
      </div>

      <div class="panel">
        <h2>Chronicle</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <script>
    // ---------- STATE ----------
    const state = {
      essence: 5,
      knowledge: 3,
      offerings: 2,
      favor: 0,
      legend: 0,
      day: 1,
      stones: [
        { name: "Heart Stone", integrity: 40, x: 150, y: 130 },
        { name: "North Ward", integrity: 25, x: 150, y: 40 },
        { name: "East Sentinel", integrity: 30, x: 250, y: 160 },
        { name: "West Guardian", integrity: 20, x: 50, y: 160 }
      ],
      roads: [
        { name: "North Hollow", clarity: 30, from: 0, to: 1 },
        { name: "East Path", clarity: 20, from: 0, to: 2 },
        { name: "West Way", clarity: 15, from: 0, to: 3 }
      ],
      events: []
    };

    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');

    // ---------- HELPERS ----------
    function log(msg, type = '') {
      const p = document.createElement('p');
      p.textContent = msg;
      if (type) p.className = type;
      logEl.prepend(p);
      while (logEl.children.length > 40) logEl.removeChild(logEl.lastChild);
    }

    function updateUI() {
      document.getElementById('resEssence').textContent = state.essence;
      document.getElementById('resKnowledge').textContent = state.knowledge;
      document.getElementById('resOfferings').textContent = state.offerings;
      document.getElementById('resFavor').textContent = state.favor;
      document.getElementById('resLegend').textContent = state.legend;
      document.getElementById('legendFill').style.width = Math.min(100, state.legend) + '%';

      document.getElementById('btnRepair').disabled = state.essence < 2;
      document.getElementById('btnClear').disabled = state.knowledge < 2;
      document.getElementById('btnOffer').disabled = state.offerings < 1;
      document.getElementById('btnSeek').disabled = state.knowledge < 3;

      const avgIntegrity = state.stones.reduce((s, st) => s + st.integrity, 0) / state.stones.length;
      const avgClarity = state.roads.reduce((s, r) => s + r.clarity, 0) / state.roads.length;
      let status = `Day ${state.day}. `;
      if (avgIntegrity > 70 && avgClarity > 60) status += "The circle shines with living power.";
      else if (avgIntegrity > 50) status += "The stones hum softly.";
      else if (avgIntegrity < 25) status += "The stones grow quiet and cold.";
      else status += "The ancient circle waits.";
      document.getElementById('mapStatus').textContent = status;
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // soft glow background
      const grad = ctx.createRadialGradient(150, 130, 20, 150, 130, 140);
      grad.addColorStop(0, 'rgba(60, 100, 50, 0.15)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 300, 260);

      // roads
      state.roads.forEach(road => {
        const a = state.stones[road.from];
        const b = state.stones[road.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        const alpha = 0.25 + (road.clarity / 100) * 0.7;
        ctx.strokeStyle = `rgba(140, 200, 100, ${alpha})`;
        ctx.lineWidth = 2 + (road.clarity / 50);
        ctx.stroke();

        // small path markers
        if (road.clarity > 40) {
          ctx.fillStyle = `rgba(180, 230, 140, ${alpha})`;
          ctx.beginPath();
          ctx.arc((a.x + b.x) / 2, (a.y + b.y) / 2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // stones
      state.stones.forEach((stone, i) => {
        const r = i === 0 ? 22 : 14;
        const glow = stone.integrity / 100;

        // outer glow
        ctx.beginPath();
        ctx.arc(stone.x, stone.y, r + 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 180, 80, ${0.1 + glow * 0.25})`;
        ctx.fill();

        // stone body
        ctx.beginPath();
        ctx.arc(stone.x, stone.y, r, 0, Math.PI * 2);
        const stoneGrad = ctx.createRadialGradient(stone.x - 4, stone.y - 4, 2, stone.x, stone.y, r);
        stoneGrad.addColorStop(0, `rgb(${80 + glow * 60}, ${100 + glow * 80}, ${70 + glow * 40})`);
        stoneGrad.addColorStop(1, `rgb(${40 + glow * 30}, ${55 + glow * 40}, ${35 + glow * 25})`);
        ctx.fillStyle = stoneGrad;
        ctx.fill();
        ctx.strokeStyle = `rgba(160, 220, 120, ${0.3 + glow * 0.5})`;
        ctx.lineWidth = 2;
        ctx.stroke();

        // tiny rune spark when strong
        if (stone.integrity > 65) {
          ctx.fillStyle = `rgba(200, 255, 160, ${0.4 + Math.sin(Date.now() / 400) * 0.2})`;
          ctx.beginPath();
          ctx.arc(stone.x, stone.y - r + 4, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // ---------- ACTIONS ----------
    function repairStone() {
      if (state.essence < 2) return;
      state.essence -= 2;
      // repair the weakest stone
      let weakest = state.stones[0];
      state.stones.forEach(s => { if (s.integrity < weakest.integrity) weakest = s; });
      const gain = 12 + Math.floor(Math.random() * 10);
      weakest.integrity = Math.min(100, weakest.integrity + gain);
      state.legend += 2;
      log(`You restore the ${weakest.name}. Ancient power stirs within the rock (+${gain} integrity).`, 'event');
      maybeEvent();
      updateUI();
      drawMap();
    }

    function clearRoad() {
      if (state.knowledge < 2) return;
      state.knowledge -= 2;
      let weakest = state.roads[0];
      state.roads.forEach(r => { if (r.clarity < weakest.clarity) weakest = r; });
      const gain = 15 + Math.floor(Math.random() * 12);
      weakest.clarity = Math.min(100, weakest.clarity + gain);
      state.legend += 2;
      log(`You clear the ${weakest.name}. The Hollow Road opens wider for those who walk with purpose.`, 'event');
      maybeEvent();
      updateUI();
      drawMap();
    }

    function leaveOffering() {
      if (state.offerings < 1) return;
      state.offerings -= 1;
      state.essence += 1 + Math.floor(Math.random() * 2);
      state.favor += 1;
      state.legend += 1;
      log("You leave an offering at the Heart Stone. The air grows warmer. Nature answers.", 'event');
      maybeEvent();
      updateUI();
      drawMap();
    }

    function seekLegend() {
      if (state.knowledge < 3) return;
      state.knowledge -= 3;
      state.legend += 5 + Math.floor(Math.random() * 6);
      const legends = [
        "A fragment returns: long ago a hero stood here and the stones sang her name.",
        "You recall the tale of the three brothers who walked the Hollow Roads and never grew old.",
        "A vision of green fire dances across the circle — the first Keepers are remembered.",
        "The North Ward whispers of a lost path that once led to the summer courts.",
        "You uncover the old name of the East Sentinel. The road toward it brightens."
      ];
      log(legends[Math.floor(Math.random() * legends.length)], 'event');
      maybeEvent();
      updateUI();
      drawMap();
    }

    function endDay() {
      state.day++;
      // passive decay
      state.stones.forEach(s => {
        if (s.integrity > 10) s.integrity = Math.max(10, s.integrity - (2 + Math.floor(Math.random() * 3)));
      });
      state.roads.forEach(r => {
        if (r.clarity > 5) r.clarity = Math.max(5, r.clarity - (2 + Math.floor(Math.random() * 4)));
      });

      // daily gifts from nature & favor
      if (state.favor > 0 && Math.random() < 0.5) {
        state.essence += 1;
        log("A traveler leaves a small gift of pure Essence in thanks.");
      }
      if (state.legend > 20 && Math.random() < 0.4) {
        state.knowledge += 1;
        log("The awakened legends teach you something new.");
      }

      // random positive or challenge event
      const roll = Math.random();
      if (roll < 0.35) {
        heroicEvent();
      } else if (roll < 0.55) {
        natureEvent();
      } else if (roll < 0.7) {
        challengeEvent();
      } else {
        log(`Dawn of day ${state.day}. The Hollow Roads breathe quietly.`);
      }

      updateUI();
      drawMap();
    }

    function maybeEvent() {
      if (Math.random() < 0.25) {
        if (Math.random() < 0.6) heroicEvent();
        else natureEvent();
      }
    }

    function heroicEvent() {
      const events = [
        { text: "A young hero arrives seeking the blessing of the stones before a great journey. Your care of the circle grants her courage.", favor: 2, essence: 1 },
        { text: "Three companions rest at the circle. They share tales of distant mountains and leave offerings.", favor: 1, offerings: 2 },
        { text: "A wandering bard sings the old names of the stones. Legend Strength rises.", legend: 4, knowledge: 1 },
        { text: "A knight in green cloak kneels and asks the roads to guide him true. The paths answer.", favor: 2, clarity: 8 },
        { text: "Children from a nearby village bring wildflowers and ask to hear a legend. Joy strengthens the circle.", favor: 1, legend: 3 }
      ];
      const e = events[Math.floor(Math.random() * events.length)];
      log(e.text, 'event');
      if (e.favor) state.favor += e.favor;
      if (e.essence) state.essence += e.essence;
      if (e.offerings) state.offerings += e.offerings;
      if (e.legend) state.legend += e.legend;
      if (e.knowledge) state.knowledge += e.knowledge;
      if (e.clarity) {
        state.roads.forEach(r => r.clarity = Math.min(100, r.clarity + e.clarity));
      }
    }

    function natureEvent() {
      const events = [
        "Mist rises from the hollows and leaves behind pure Essence.",
        "Wild deer walk the North Hollow without fear. The road feels more alive.",
        "A great oak near the West Way drops a branch heavy with power. You gather its gift.",
        "Night-blooming flowers open around the Heart Stone. Their light feeds the circle.",
        "A hawk circles three times and drops a single feather that glows with Knowledge."
      ];
      log(events[Math.floor(Math.random() * events.length)], 'event');
      state.essence += 1 + Math.floor(Math.random() * 2);
      if (Math.random() < 0.4) state.knowledge += 1;
    }

    function challengeEvent() {
      const events = [
        { text: "Thorns and shadow creep along one road. The path darkens.", clarity: -12 },
        { text: "A cold wind scours the stones. Integrity wanes.", integrity: -10 },
        { text: "Forgotten sorrow stirs. A stone grows heavy and quiet.", integrity: -8 },
        { text: "The roads remember old battles. Clarity fades in places.", clarity: -8 }
      ];
      const e = events[Math.floor(Math.random() * events.length)];
      log(e.text, 'warn');
      if (e.clarity) {
        const r = state.roads[Math.floor(Math.random() * state.roads.length)];
        r.clarity = Math.max(5, r.clarity + e.clarity);
      }
      if (e.integrity) {
        const s = state.stones[Math.floor(Math.random() * state.stones.length)];
        s.integrity = Math.max(10, s.integrity + e.integrity);
      }
    }

    // ---------- INIT ----------
    document.getElementById('btnRepair').onclick = repairStone;
    document.getElementById('btnClear').onclick = clearRoad;
    document.getElementById('btnOffer').onclick = leaveOffering;
    document.getElementById('btnSeek').onclick = seekLegend;
    document.getElementById('btnEnd').onclick = endDay;

    log("You take up the quiet duty of Keeper. The Standing Stones and the Hollow Roads are under your care.");
    log("Restore the circle. Clear the paths. Welcome those who walk with heroic hearts. The legends will remember.");
    updateUI();
    drawMap();

    // gentle animation
    setInterval(drawMap, 800);
  </script>
</body>
</html>
